spring.application.name=distributed-api-platform

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/distributed_platform
spring.datasource.username=platform_user
spring.datasource.password=platform_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info,metrics